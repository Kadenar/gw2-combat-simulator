name: Validate project
description: Run the shared publication checks and preserve per-suite test reports.
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      id: install
      shell: bash
      run: npm ci
    # Run independent checks after failures, but keep their failed status blocking publication.
    - name: Check formatting
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      run: npm run format:check
    - name: Lint
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      run: npm run lint
    - name: Build static assets
      id: build
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      run: |
        npm run build
        mkdir -p dist/test-reports
    - name: Typecheck
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      shell: bash
      run: npm run typecheck
    # Each directory group gets readable logs and its own machine-readable test report.
    # Quote file globs so Node discovers nested tests instead of executing directories as modules.
    - name: Test engine and kernel
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/engine.xml "tests/kernel/**/*.test.js"
        "tests/games/gw2/platform/**/*.test.js"
    # Keep shared contracts and each profession visible independently without skipping checks after a failure.
    - name: Test shared profession contracts
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-shared.xml tests/games/gw2/professions/*.test.js
    - name: Test Elementalist
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-elementalist.xml
        tests/games/gw2/professions/elementalist/*.test.js
    - name: Test Engineer
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-engineer.xml
        tests/games/gw2/professions/engineer/*.test.js
    - name: Test Guardian
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-guardian.xml
        tests/games/gw2/professions/guardian/*.test.js
    - name: Test Mesmer
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-mesmer.xml
        tests/games/gw2/professions/mesmer/*.test.js
    - name: Test Necromancer
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-necromancer.xml
        tests/games/gw2/professions/necromancer/*.test.js
    - name: Test Ranger
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-ranger.xml
        tests/games/gw2/professions/ranger/*.test.js
    - name: Test Revenant
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-revenant.xml
        tests/games/gw2/professions/revenant/*.test.js
    - name: Test Thief
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-thief.xml tests/games/gw2/professions/thief/*.test.js
    - name: Test Warrior
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/professions-warrior.xml
        tests/games/gw2/professions/warrior/*.test.js
    - name: Test app and UI
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/app-ui.xml "tests/browser/**/*.test.js"
        "tests/games/gw2/app/**/*.test.js" "tests/ui/**/*.test.js"
    - name: Test importers and log analysis
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/importers.xml "tests/games/gw2/integrations/logs/**/*.test.js"
    - name: Test architecture and scripts
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: >-
        npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
        --test-reporter-destination=dist/test-reports/tooling.xml "tests/architecture/**/*.test.*js"
        "tests/scripts/**/*.test.mjs"
    - name: Validate compiled modules
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: node scripts/build/check-dist.mjs
    - name: Validate static site
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: node scripts/build/check-site.mjs
    - name: Test browser
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: npm run test:browser -- --reporter=line,github,junit,html
      env:
        PLAYWRIGHT_JUNIT_OUTPUT_FILE: dist/test-reports/browser.xml
        PLAYWRIGHT_HTML_OUTPUT_DIR: dist/test-reports/browser-html
        PLAYWRIGHT_HTML_OPEN: never
    # Preserve reports on failure and before the Pages rebuild cleans dist.
    - name: Upload test reports
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          dist/test-reports/
          dist/playwright-results/
        retention-days: 14
