# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      # Run independent checks after failures, but keep their failed status blocking publication.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Build static assets
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run build
          mkdir -p dist/test-reports
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      # Each directory group gets readable logs and its own machine-readable test report.
      - name: Test engine and kernel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/engine.xml tests/kernel tests/platform
      - name: Test professions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/professions.xml tests/professions
      - name: Test app and UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/app-ui.xml tests/app tests/ui
      - name: Test importers and log analysis
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/importers.xml tests/evtc tests/dps-report tests/log-analyzer
      - name: Test architecture and scripts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/tooling.xml tests/architecture tests/scripts tests/fixtures
      - name: Validate compiled modules
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/build/check-dist.mjs
      - name: Validate static site
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/build/check-site.mjs
      - name: Test browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:browser -- --reporter=line,github,junit,html
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: dist/test-reports/browser.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: dist/test-reports/browser-html
          PLAYWRIGHT_HTML_OPEN: never
      # Preserve reports on failure and before the Pages rebuild cleans dist.
      - name: Upload test reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            dist/test-reports/
            dist/playwright-results/
          retention-days: 14
      # Rebuild in the GitHub Pages mode so only the uploaded artifact contains the hosted-site redirect.
      - name: Build GitHub Pages static assets
        run: npm run build:github-pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build revision-consistent static site
        shell: bash
        run: |
          mkdir _site
          cp -a dist/site/. _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
