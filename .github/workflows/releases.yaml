name: Publish release artifact

on:
  # Stable published releases provide the default no-redirect site artifact.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      # Run independent checks after failures, but keep their failed status blocking publication.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Build static assets
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run build
          mkdir -p dist/test-reports
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      # Each directory group gets readable logs and its own machine-readable test report.
      - name: Test engine and kernel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/engine.xml tests/kernel tests/platform
      - name: Test professions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/professions.xml tests/professions
      - name: Test app and UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/app-ui.xml tests/app tests/ui
      - name: Test importers and log analysis
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/importers.xml tests/evtc tests/dps-report tests/log-analyzer
      - name: Test architecture and scripts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          npm run test:node -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit
          --test-reporter-destination=dist/test-reports/tooling.xml tests/architecture tests/scripts tests/fixtures
      - name: Validate compiled modules
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/build/check-dist.mjs
      - name: Validate static site
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/build/check-site.mjs
      - name: Test browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:browser -- --reporter=line,github,junit,html
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: dist/test-reports/browser.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: dist/test-reports/browser-html
          PLAYWRIGHT_HTML_OPEN: never
      # Preserve reports on failure and before the Pages rebuild cleans dist.
      - name: Upload test reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            dist/test-reports/
            dist/playwright-results/
          retention-days: 14
      - name: Verify redirect is absent
        shell: bash
        run: |
          if grep -R --include='*.html' -q 'GITHUB_PAGES_HOST' dist/site; then
            echo 'Release artifact contains the GitHub Pages redirect.' >&2
            exit 1
          fi
      - name: Package static site
        working-directory: dist/site
        run: zip -r ../../gw2-combat-simulator-site.zip .
      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" gw2-combat-simulator-site.zip --clobber
